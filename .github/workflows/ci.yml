name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Types, lint and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bunx tsc --noEmit
      - run: bunx biome ci .
      - run: bun test --coverage

  analysis:
    name: Python analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: analysis/requirements*.txt
      - run: pip install -r analysis/requirements.txt -r analysis/requirements-dev.txt
      - run: ruff format --check --config analysis/ruff.toml analysis
      - run: ruff check --config analysis/ruff.toml analysis
      # Reruns the judge comparison from the committed dataset and fails if any number moved.
      - run: |
          cp reports/judge-comparison.json /tmp/before.json
          python analysis/judges.py
          python - <<'PY'
          import json
          def rounded(x):
              if isinstance(x, float): return round(x, 6)
              if isinstance(x, dict): return {k: rounded(v) for k, v in x.items()}
              if isinstance(x, list): return [rounded(v) for v in x]
              return x
          def core(p):
              d = json.load(open(p))
              d.pop('generatedAt')
              d['xgboost'].pop('predictMicroseconds'); d['xgboost'].pop('featureMilliseconds')
              return json.dumps(rounded(d), sort_keys=True)
          assert core('/tmp/before.json') == core('reports/judge-comparison.json'), 'judge comparison changed'
          print('judge comparison reproduced exactly')
          PY
